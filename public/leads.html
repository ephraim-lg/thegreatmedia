<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Leads — The Great Media</title>
<style>
  :root{
    --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c; --line:rgba(255,255,255,.09);
    --fg:#fff; --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.32);
    --hot:#34d399; --warm:#fbbf24; --cold:#f87171; --accent:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1250px;margin:0 auto;padding:28px 20px 80px}

  /* gate */
  #gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
  .gate-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px}
  .gate-card h1{font-size:19px;margin-bottom:6px}
  .gate-card p{color:var(--dim);font-size:13.5px;margin-bottom:20px}
  input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:12px 14px;font:inherit;font-size:14px}
  input:focus,select:focus{outline:none;border-color:rgba(255,255,255,.3)}
  button{cursor:pointer;font:inherit;border:none}
  .btn{background:var(--accent);color:#000;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px;width:100%;margin-top:12px}
  .btn-sm{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;width:auto;margin:0}
  .btn-sm:hover{background:rgba(255,255,255,.14)}
  .err{color:var(--cold);font-size:13px;margin-top:10px;display:none}

  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
  header h1{font-size:22px;letter-spacing:-.02em}
  header .sub{color:var(--faint);font-size:12.5px;margin-top:2px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:700}
  .stat .v{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat .f{font-size:12px;color:var(--dim);margin-top:3px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .filters select,.filters input{width:auto;min-width:150px;padding:9px 12px;font-size:13px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:900px}
  th{text-align:left;padding:12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
     color:var(--faint);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
  td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,.02)}
  .nm{font-weight:600}
  .muted{color:var(--dim);font-size:12.5px}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .p-hot{background:rgba(52,211,153,.15);color:var(--hot)}
  .p-warm{background:rgba(251,191,36,.15);color:var(--warm)}
  .p-cold{background:rgba(248,113,113,.15);color:var(--cold)}
  .p-plain{background:rgba(255,255,255,.08);color:var(--dim)}
  td select{width:auto;padding:6px 9px;font-size:12.5px;border-radius:9px}
  a{color:inherit}
  .wa{color:var(--hot);text-decoration:none;font-weight:600}
  .empty{padding:56px 24px;text-align:center;color:var(--dim)}
  .empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#000;
    padding:11px 20px;border-radius:99px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Leads</h1>
    <p>Enter your admin key to see the pipeline.</p>
    <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
    <button class="btn" onclick="unlock()">Open dashboard</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div>
      <h1>Leads</h1>
      <div class="sub" id="updated"></div>
    </div>
    <div class="actions">
      <button class="btn-sm" onclick="load()">Refresh</button>
      <button class="btn-sm" onclick="exportCsv()">Export CSV</button>
      <button class="btn-sm" onclick="lock()">Lock</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <select id="f-status" onchange="render()">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="contacted">Contacted</option>
      <option value="qualified">Qualified</option>
      <option value="won">Won</option>
      <option value="lost">Lost</option>
    </select>
    <select id="f-quality" onchange="render()">
      <option value="">Any quality</option>
      <option value="hot">Hot (60+)</option>
      <option value="warm">Warm (35–59)</option>
      <option value="cold">Cold (under 35)</option>
    </select>
    <select id="f-campaign" onchange="render()"><option value="">All campaigns</option></select>
    <input id="f-search" placeholder="Search name, business, phone…" oninput="render()">
  </div>

  <div class="panel">
    <div class="tbl-scroll"><table>
      <thead><tr>
        <th>When</th><th>Lead</th><th>Contact</th><th>Wants</th>
        <th>Budget</th><th>Score</th><th>Came from</th><th>Status</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="empty" id="empty" style="display:none">
      <strong>No leads yet</strong>
      Applications submitted on the site appear here the moment they are saved.
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://tgm-leads-api.ephraimbanda888.workers.dev";
const KEY_STORE = "tgm_admin_key";
let LEADS = [];

const BUDGET = { low:"Under K10,000/mo", starter:"K10,000–K20,000/mo", growth:"K20,000–K50,000/mo", premium:"K50,000–K100,000/mo", elite:"K100,000+/mo" };
const WEB_BUDGET = { low:"Under K7,500", starter:"K7,500–K15,000", growth:"K15,000–K35,000", premium:"K35,000–K75,000", elite:"K75,000+" };
const SERVICE = { ads:"Ads", website:"Website only", both:"Ads + Website", ecom:"E-commerce", system:"System", unsure:"Unsure" };

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2200); }
function key(){ return sessionStorage.getItem(KEY_STORE) || ""; }

async function unlock(){
  const k = document.getElementById("key").value.trim();
  const err = document.getElementById("gate-err");
  if(!k){ err.textContent="Enter your key."; err.style.display="block"; return; }
  sessionStorage.setItem(KEY_STORE, k);
  const res = await fetch(API + "/stats", { headers:{ "x-admin-key": k } });
  if(!res.ok){
    sessionStorage.removeItem(KEY_STORE);
    err.textContent = res.status === 401 ? "That key was rejected." : "Could not reach the API (" + res.status + ").";
    err.style.display = "block";
    return;
  }
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  load();
}
function lock(){ sessionStorage.removeItem(KEY_STORE); location.reload(); }

async function load(){
  try{
    const [statsRes, leadsRes] = await Promise.all([
      fetch(API + "/stats", { headers:{ "x-admin-key": key() } }),
      fetch(API + "/leads?limit=1000", { headers:{ "x-admin-key": key() } })
    ]);
    if(!statsRes.ok || !leadsRes.ok) throw new Error("API " + statsRes.status + "/" + leadsRes.status);
    const stats = await statsRes.json();
    LEADS = (await leadsRes.json()).leads || [];
    renderStats(stats);
    fillCampaigns();
    render();
    document.getElementById("updated").textContent =
      "Updated " + new Date().toLocaleTimeString() + " · " + LEADS.length + " leads stored";
  }catch(e){
    toast("Could not load leads — " + e.message);
  }
}

function renderStats(s){
  const cards = [
    ["Total leads", s.total, "all time"],
    ["Last 7 days", s.last7, "new this week"],
    ["Last 30 days", s.last30, "new this month"],
    ["Hot leads", s.hot, "score 60 or above"],
    ["Average score", s.avgScore, "out of 100"],
    ["Won", (s.byStatus && s.byStatus.won) || 0, "closed deals"]
  ];
  document.getElementById("stats").innerHTML = cards.map(([k,v,f]) =>
    '<div class="stat"><div class="k">'+k+'</div><div class="v">'+(v??0)+'</div><div class="f">'+f+'</div></div>'
  ).join("");
}

function fillCampaigns(){
  const sel = document.getElementById("f-campaign");
  const current = sel.value;
  const names = [...new Set(LEADS.map(l => l.utm_campaign).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All campaigns</option>' + names.map(n => '<option>'+esc(n)+'</option>').join("");
  sel.value = current;
}

function band(score){ return score >= 60 ? "hot" : score >= 35 ? "warm" : "cold"; }
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(iso){
  const mins = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + "m ago";
  if(mins < 1440) return Math.floor(mins/60) + "h ago";
  return Math.floor(mins/1440) + "d ago";
}

function render(){
  const fs = document.getElementById("f-status").value;
  const fq = document.getElementById("f-quality").value;
  const fc = document.getElementById("f-campaign").value;
  const q  = document.getElementById("f-search").value.toLowerCase().trim();

  const rows = LEADS.filter(l =>
    (!fs || l.status === fs) &&
    (!fq || band(l.quality_score||0) === fq) &&
    (!fc || l.utm_campaign === fc) &&
    (!q  || [l.name,l.business_name,l.phone,l.email].some(v => (v||"").toLowerCase().includes(q)))
  );

  document.getElementById("empty").style.display = rows.length ? "none" : "block";
  document.getElementById("rows").innerHTML = rows.map(l => {
    const s = l.quality_score || 0;
    const wa = (l.phone||"").replace(/\D/g,"");
    const from = [l.utm_campaign, l.source].filter(Boolean).join(" · ") || "direct";
    return '<tr>'
      + '<td class="muted">'+ago(l.created_at)+'</td>'
      + '<td><div class="nm" style="cursor:pointer" onclick="toggleDetail(''+l.id+'')" title="Show full application">'+esc(l.name)+' ▾</div><div class="muted">'+esc(l.business_name||"—")+'</div></td>'
      + '<td><a class="wa" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">'+esc(l.phone)+'</a>'
        + (l.email ? '<div class="muted">'+esc(l.email)+'</div>' : '')+'</td>'
      + '<td>'+esc(SERVICE[l.service]||l.service||"—")+'<div class="muted">'+esc(l.timeline||"")+'</div></td>'
      + '<td>'+esc((l.service==="website" ? (WEB_BUDGET[l.budget]||l.budget)+" once" : BUDGET[l.budget])||l.budget||"—")+'</td>'
      + '<td><span class="pill p-'+band(s)+'">'+s+'</span></td>'
      + '<td class="muted">'+esc(from)+(l.country ? ' · '+esc(l.country) : '')+'</td>'
      + '<td><select onchange="setStatus(\''+l.id+'\', this.value)">'
        + ["new","contacted","qualified","won","lost"].map(st =>
            '<option value="'+st+'"'+(l.status===st?' selected':'')+'>'+st[0].toUpperCase()+st.slice(1)+'</option>').join("")
        + '</select></td>'
      + '</tr>'
      + '<tr id="d-'+l.id+'" style="display:none"><td colspan="8" style="white-space:pre-wrap;color:var(--dim);font-size:13px;line-height:1.55;padding:8px 14px 18px">'+esc(l.notes||"No application details stored.")+'</td></tr>';
  }).join("");
}

function toggleDetail(id){ const r=document.getElementById("d-"+id); if(r) r.style.display = r.style.display==="none" ? "table-row" : "none"; }

async function setStatus(id, status){
  try{
    const res = await fetch(API + "/lead/" + id, {
      method:"PATCH",
      headers:{ "content-type":"application/json", "x-admin-key": key() },
      body: JSON.stringify({ status })
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const lead = LEADS.find(l => l.id === id);
    if(lead) lead.status = status;
    toast("Marked " + status);
    const s = await (await fetch(API + "/stats", { headers:{ "x-admin-key": key() } })).json();
    renderStats(s);
  }catch(e){ toast("Could not update — " + e.message); }
}

function exportCsv(){ window.open(API + "/export.csv?key=" + encodeURIComponent(key()), "_blank"); }

if(sessionStorage.getItem(KEY_STORE)){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  load();
}
document.getElementById("key").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
</script>
</body>
</html>
